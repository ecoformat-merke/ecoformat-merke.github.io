<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eco Club 2.0 — Рабочий кабинет</title><meta name="theme-color" content="#0b3527">
<style>
:root{--green:#0c5339;--text:#15382b;--pale:#eaf5ee;--line:#d9e8df;--muted:#6a8073}*{box-sizing:border-box}body{margin:0;background:#f4f9f5;color:var(--text);font:15px/1.5 Inter,"Segoe UI",Arial,sans-serif}a{color:#0c6743;text-decoration:none;font-weight:750}button{cursor:pointer;font:inherit;border:0;border-radius:10px;background:#e5f1e8;color:var(--green);padding:10px 15px;font-weight:750}button:hover{filter:brightness(.97)}header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:3}.top{max-width:1180px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:17px 20px}.brand{font-weight:900;font-size:19px}.header-actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.wrap{max-width:1180px;padding:30px 20px 60px;margin:auto}h1{font-size:clamp(30px,4.5vw,48px);letter-spacing:-1px;line-height:1.15;margin:8px 0 11px}h2{margin:0 0 8px;font-size:23px}p{margin:8px 0 15px}.muted{color:var(--muted)}.chip{display:inline-block;background:var(--pale);color:var(--green);border-radius:60px;padding:7px 12px;font-size:12px;font-weight:800}.lead{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(240px,.7fr);gap:18px;margin-bottom:22px}.card{background:white;border:1px solid var(--line);border-radius:20px;padding:25px;box-shadow:0 12px 36px #153e2411}.identity{display:flex;gap:16px;align-items:center}.avatar{width:58px;height:58px;flex:none;display:grid;place-items:center;border-radius:17px;background:var(--green);color:white;font-size:27px;font-weight:900}.identity strong{display:block;overflow-wrap:anywhere}.identity small{color:var(--muted);overflow-wrap:anywhere}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}.feature{display:flex;flex-direction:column;gap:10px}.feature .symbol{font-size:28px}.feature h3{margin:0;font-size:18px}.feature p{color:var(--muted);font-size:14px;flex:1}.link{display:inline-flex;justify-content:center;align-items:center;padding:11px 15px;background:#0f6847;border-radius:10px;color:white;text-decoration:none;font-weight:800}.link:hover{background:#0b563b}.link.secondary{background:var(--pale);color:var(--green)}.disabled{border:1px dashed #a4bcb0;color:#698076!important;background:#f7fbf8!important;cursor:default}.notice{margin-top:20px;border:1px solid var(--line);background:#eef6f0;border-radius:14px;padding:16px 19px;font-size:14px;color:#3c5e4b}.hidden{display:none!important}.error{background:#fff0ef;color:#a02e27;border-radius:13px;padding:16px}.loading{text-align:center;margin:12vh auto;max-width:550px}.pill{font-size:12px;font-weight:800;color:#38674c}.stats{display:flex;gap:16px;flex-wrap:wrap}.stat{background:#f1f7f1;border-radius:10px;padding:12px 16px;flex:1}.stat b{display:block;font-size:18px}.section-title{margin:32px 0 16px;font-size:19px}@media(max-width:840px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.lead{grid-template-columns:1fr}}@media(max-width:560px){.grid{grid-template-columns:1fr}.top{align-items:start}.card{padding:20px}.header-actions{justify-content:end}header{position:static}}
</style></head><body>
<header><div class="top"><a class="brand" href="./">🌿 ECO CLUB</a><div class="header-actions"><button type="button" id="lang">ҚАЗ / РУС</button><a href="./">Сайт</a><button type="button" id="logout">Выйти</button></div></div></header>
<main class="wrap">
<div id="loading" class="card loading"><h2>Eco Club 2.0</h2><p>Проверяем ваш Google-аккаунт и разрешённую роль…</p></div>
<div id="error" class="error hidden" role="alert"></div>
<section id="content" class="hidden">
<div class="lead"><div class="card"><span class="chip" id="badge">Личный кабинет</span><h1 id="heading">Eco Club 2.0</h1><p id="subtitle" class="muted">Единая платформа экологических достижений и мероприятий.</p></div>
<div class="card"><div class="identity"><div class="avatar" id="avatar">E</div><div><strong id="displayName"></strong><small id="email"></small></div></div><div class="stats" style="margin-top:20px"><div class="stat"><span class="pill" id="roleLabel">Роль</span><b id="role"></b></div><div class="stat"><span class="pill" id="statusLabel">Статус</span><b id="status"></b></div></div></div></div>
<h2 class="section-title" id="sectionTitle">Доступные разделы</h2><div class="grid" id="features"></div>
<div class="notice" id="notice"></div></section>
</main>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js';
import {getAuth,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js';
import {getFirestore,doc,getDoc} from 'https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js';
const config={apiKey:'AIzaSyCo05dvjXihGbfYhU_FHQ4OXg6SO_oRCU0',authDomain:'eco-club-40261.firebaseapp.com',projectId:'eco-club-40261',appId:'1:289680452873:web:c4fe4d451f1a488b9d37d8'};
const app=initializeApp(config),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);
let user=null,profile=null,lang='ru';
const dict={
ru:{title:'Рабочий кабинет',roleLabel:'Роль',statusLabel:'Статус',active:'Активен',pending:'Ожидает',blocked:'Заблокирован',sectionTitle:'Ваши разделы',go:'Открыть',soon:'Подключается',admin:'Администратор',leader:'Руководитель',teacher:'Учитель',student:'Ученик',visitor:'Заявка',subtitle:'Единый кабинет Eco Club с доступом по подтверждённой роли.',public:'Публичный Eco Club',publicDesc:'Новости, проекты, результаты и материалы школы.',adminUsers:'Пользователи и роли',adminUsersDesc:'Заявки, блокировка и назначения подтверждённых пользователей.',studentPassport:'Мой Eco Passport',studentPassportDesc:'Личные вклады и достижения будут подключены после проверки доступа к данным ученика.',teacherEvents:'Мои мероприятия',teacherEventsDesc:'Личные черновики и переход к действующей форме отправки v37. Отправка на модерацию пока отдельно.',moderation:'Модерация',moderationDesc:'Обработка мероприятий и вкладов через защищённую серверную проверку — следующий этап.',rankings:'Публичные рейтинги',rankingsDesc:'Доступные всем участникам результаты Eco Club.',notice:'Данные существующих Apps Script пока НЕ подключены к Firebase Auth. Эта страница не предоставляет доступ к старой админ-панели и не показывает персональные данные других пользователей.',wait:'Ваша роль ещё не подтверждена. Обновите статус на странице регистрации.',blockedMsg:'Ваш аккаунт ограничен. Обратитесь к руководителю проекта.'},
kk:{title:'Жұмыс кабинеті',roleLabel:'Рөл',statusLabel:'Мәртебе',active:'Белсенді',pending:'Күтілуде',blocked:'Бұғатталған',sectionTitle:'Бөлімдеріңіз',go:'Ашу',soon:'Қосылады',admin:'Әкімші',leader:'Жетекші',teacher:'Мұғалім',student:'Оқушы',visitor:'Өтінім',subtitle:'Расталған рөлге сәйкес Eco Club бірыңғай кабинеті.',public:'Ашық Eco Club',publicDesc:'Жаңалықтар, жобалар, нәтижелер және мектеп материалдары.',adminUsers:'Пайдаланушылар және рөлдер',adminUsersDesc:'Өтінімдер, бұғаттау және расталған пайдаланушылардың рөлдерін тағайындау.',studentPassport:'Менің Eco Passport',studentPassportDesc:'Жеке үлестер мен жетістіктер оқушы деректеріне қауіпсіз қолжетімділік тексерілгеннен кейін қосылады.',teacherEvents:'Менің іс-шараларым',teacherEventsDesc:'Жеке жобалар және v37 жіберу формасына өту. Модерацияға жіберу әзірше бөлек.',moderation:'Модерация',moderationDesc:'Іс-шаралар мен үлестерді серверлік тексерумен өңдеу келесі кезеңде іске асады.',rankings:'Ашық рейтингтер',rankingsDesc:'Барлық қатысушыларға қолжетімді Eco Club нәтижелері.',notice:'Бұрынғы Apps Script деректері Firebase Auth-қа әлі қосылмаған. Бұл бет бұрынғы әкімші панеліне рұқсат бермейді және өзге пайдаланушылардың жеке деректерін көрсетпейді.',wait:'Рөліңіз әлі расталмады. Тіркелу бетінде мәртебені жаңартыңыз.',blockedMsg:'Аккаунтыңызға шектеу қойылған. Жоба жетекшісіне хабарласыңыз.'}};
const tr=k=>dict[lang][k]||dict.ru[k]||k;
const base='./';
function card(symbol,key,description,href,ready){const x=document.createElement('article');x.className='card feature';const i=document.createElement('div');i.className='symbol';i.textContent=symbol;const h=document.createElement('h3');h.textContent=tr(key);const p=document.createElement('p');p.textContent=tr(description);const link=document.createElement(ready?'a':'span');link.className='link'+(ready?'':' disabled');if(ready)link.href=href;link.textContent=tr(ready?'go':'soon');x.append(i,h,p,link);$('features').append(x)}
function render(){if(!user||!profile)return;$('content').classList.remove('hidden');$('loading').classList.add('hidden');$('displayName').textContent=user.displayName||profile.displayName||'';$('email').textContent=user.email||'';$('avatar').textContent=(user.displayName||'E').trim().charAt(0).toUpperCase();$('heading').textContent=tr('title');$('subtitle').textContent=tr('subtitle');$('roleLabel').textContent=tr('roleLabel');$('statusLabel').textContent=tr('statusLabel');$('sectionTitle').textContent=tr('sectionTitle');$('notice').textContent=tr('notice');let role=profile.status==='active'?profile.role:'visitor';$('badge').textContent=tr(role);$('role').textContent=tr(role);$('status').textContent=tr(profile.status);$('features').replaceChildren();
if(profile.status!=='active'){$('notice').textContent=tr(profile.status==='blocked'?'blockedMsg':'wait');card('🌐','public','publicDesc',base,true);return}
if(role==='admin')card('👥','adminUsers','adminUsersDesc','admin-users.html',true);
if(role==='admin'||role==='leader')card('✅','moderation','moderationDesc','',false);
if(role==='teacher'||role==='admin'||role==='leader')card('📸','teacherEvents','teacherEventsDesc','teacher.html',true);
if(role==='student')card('🎒','studentPassport','studentPassportDesc','',false);
card('🌿','public','publicDesc',base,true);
card('📊','rankings','rankingsDesc','./#results',true)
}
$('lang').onclick=()=>{lang=lang==='ru'?'kk':'ru';document.documentElement.lang=lang;render()};
$('logout').onclick=async()=>{await signOut(auth);location.href='login.html'};
onAuthStateChanged(auth,async u=>{if(!u){location.replace('login.html');return}user=u;try{const d=await getDoc(doc(db,'profiles',u.uid));if(!d.exists()){location.replace('login.html');return}profile=d.data();render()}catch(e){$('error').classList.remove('hidden');$('error').textContent='Ошибка чтения профиля: '+(e?.message||e);$('loading').classList.add('hidden')}},()=>{location.replace('login.html')});
</script></body></html>
